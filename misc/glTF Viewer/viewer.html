<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glTF Viewer</title>
<!-- glTF Viewer for KimeraCS glTF exports (FFNx). Open this file in a web browser. -->
<style>
  :root { --bg: #1d1f24; --panel: #2a2d34; --field: #16181c; --line: #444a55; --text: #e6e6e6; --muted: #9aa0aa; --accent: #6aa9ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .group { display: flex; gap: 6px; align-items: center; }
  .label { color: var(--muted); }
  button, select { background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
  button:hover:not(:disabled), select:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled, select:disabled { opacity: 0.45; }
  button.primary { background: #24466f; border-color: #35659e; }
  #model { max-width: 260px; }
  #anim { max-width: 180px; }
  #frame { width: 220px; accent-color: var(--accent); }
  #flabel { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); min-width: 64px; }
  #info { display: flex; gap: 10px; align-items: center; color: var(--muted); padding: 4px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #infoText { white-space: pre; overflow: hidden; text-overflow: ellipsis; font: 12px ui-monospace, Consolas, monospace; }
  #info.problem #infoText { color: #ffb86b; }
  #view { position: relative; }
  canvas { display: block; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #hint div { text-align: center; color: var(--muted); line-height: 1.7; border: 2px dashed var(--line); border-radius: 10px; padding: 28px 36px; background: rgba(29, 31, 36, 0.85); }
  #hint b { color: var(--text); }
  body.dragging #hint div { border-color: var(--accent); color: var(--text); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="bar">
  <div class="group">
    <button id="openFolder" class="primary" title="Pick an export folder; every .gltf inside is listed">Open folder…</button>
    <input id="folderInput" type="file" webkitdirectory multiple>
  </div>
  <div class="group">
    <span class="label">Model</span>
    <select id="model" disabled><option>(none)</option></select>
  </div>
  <div class="group">
    <span class="label">Animation</span>
    <select id="anim" disabled></select>
    <button id="play" disabled title="Play / pause (Space)">▶ Play</button>
    <input id="frame" type="range" min="0" max="0" value="0" disabled>
    <span id="flabel">–</span>
    <select id="speed" title="Playback speed">
      <option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option>
    </select>
  </div>
  <div class="group">
    <label><input id="bones" type="checkbox"> Bones</label>
    <label><input id="rest" type="checkbox"> Rest pose</label>
    <button id="resetCam" disabled title="Frame the model">Reset view</button>
  </div>
  <div class="group" id="weaponGroup" hidden>
    <span class="label">Weapon</span>
    <select id="weapon" title="Battle models: show one weapon (like Kimera), all of them, or none"></select>
  </div>
</div>
<div id="info"><span id="infoText">No model loaded.</span></div>
<div id="view">
  <div id="hint"><div>
    <b>Open folder…</b> and pick an export folder: every .gltf inside is listed under Model.<br>
    You can also drag an export folder onto this window.<br>
    Left drag: rotate · Right drag: pan · Wheel: zoom · Space: play/pause · ← →: previous/next frame
  </div></div>
</div>
<!-- three.js r147 (MIT, see three.js-LICENSE.txt): classic scripts, so the page works when opened
     straight from disk (browsers block module scripts from file://) and without internet -->
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="OrbitControls.js"></script>
<script>
"use strict";
const { GLTFLoader, OrbitControls } = THREE;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');   // text put into the page's HTML

function setInfo(text, problem) {
  $('infoText').textContent = text;
  $('info').classList.toggle('problem', !!problem);
}

// ------------------------------------------------------------------ scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputEncoding = THREE.sRGBEncoding;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x30343c);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.5); sun.position.set(1, 2, 1.5); scene.add(sun);
let grid = null, model = null, mixer = null, clips = [], action = null, helper = null, times = [];
let playing = false, blobUrls = [];
const clock = new THREE.Clock();

function resize() {
  const h = window.innerHeight - $('bar').offsetHeight - $('info').offsetHeight;
  renderer.setSize(window.innerWidth, h);
  $('view').style.height = h + 'px';
  camera.aspect = window.innerWidth / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function frameCamera() {
  if (!model) return;
  // measure the posed (skinned) vertices: three.js r147 would use the unposed bind data
  model.updateMatrixWorld(true);
  const box = new THREE.Box3(), v = new THREE.Vector3();
  model.traverseVisible(o => {
    if (o.isSkinnedMesh) {
      const pos = o.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 3000));
      const skin = (o.applyBoneTransform || o.boneTransform).bind(o);
      for (let i = 0; i < pos.count; i += step) { v.fromBufferAttribute(pos, i); skin(i, v); box.expandByPoint(v.applyMatrix4(o.matrixWorld)); }
    } else if (o.isMesh) box.expandByObject(o);
  });
  if (box.isEmpty()) box.setFromObject(model);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const d = Math.max(size.x, size.y, size.z) * 1.6 + 1;
  camera.position.set(center.x + d * 0.55, center.y + d * 0.25, center.z + d);
  camera.near = d / 200; camera.far = d * 50; camera.updateProjectionMatrix();
  controls.target.copy(center); controls.update();
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  grid = new THREE.GridHelper(Math.max(size.x, size.z) * 3 + 1, 20, 0x666666, 0x444444);
  grid.position.y = box.min.y; scene.add(grid);
}

// ------------------------------------------------------------------ loading
// frees a model's geometry and textures on the graphics card (three.js keeps them until told)
function disposeModel(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    if (o.skeleton) o.skeleton.dispose();
    for (const m of [].concat(o.material)) { if (m.map) m.map.dispose(); m.dispose(); }
  });
}

function showModel(gltf, label) {
  if (model) { scene.remove(model); disposeModel(model); }
  if (helper) { scene.remove(helper); helper.geometry.dispose(); helper.material.dispose(); helper = null; }
  model = gltf.scene; scene.add(model);
  model.traverse(o => { if (o.isMesh) o.frustumCulled = false; });   // r147 culls skinned meshes by their unposed bounds
  clips = gltf.animations; mixer = new THREE.AnimationMixer(model);
  $('anim').innerHTML = clips.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join('');
  $('anim').disabled = clips.length === 0;
  helper = new THREE.SkeletonHelper(model); helper.visible = $('bones').checked; scene.add(helper);
  let prims = 0, verts = 0; model.traverse(o => { if (o.isMesh) { prims++; verts += o.geometry.attributes.position.count; } });
  setInfo(`${label}   ·   ${clips.length} animation(s), ${prims} primitive(s), ${verts} vertices`);
  setupWeapons();
  $('hint').style.display = 'none';
  $('resetCam').disabled = false;
  $('rest').checked = false;
  if (clips.length) setAnim(0); else { times = []; setPlaying(false); updateSlider(); }
  frameCamera();
}

// ------------------------------------------------------------------ weapons
// Battle exports bind every weapon model to one joint named "weapon"; show one at a time like Kimera.
let weapons = [];                                       // [{ name, objects: [Object3D] }]

function setupWeapons() {
  weapons = [];
  model.traverse(o => {
    if (!o.isSkinnedMesh) return;
    const wi = o.skeleton.bones.findIndex(b => b.name === 'weapon');
    if (wi < 0 || o.geometry.attributes.skinIndex.getX(0) !== wi) return;
    const top = o.parent && o.parent !== model && !o.parent.isBone && o.parent.type === 'Group' && o.parent.name ? o.parent : o;
    let w = weapons.find(x => x.name === top.name);
    if (!w) { w = { name: top.name, objects: [] }; weapons.push(w); }
    if (!w.objects.includes(top)) w.objects.push(top);
  });
  $('weaponGroup').hidden = weapons.length === 0;
  $('weapon').innerHTML = weapons.map((w, i) => `<option value="${i}">${i}: ${esc(w.name)}</option>`).join('') +
    (weapons.length > 1 ? '<option value="all">All</option>' : '') + '<option value="none">None</option>';
  if (weapons.length) showWeapon('0');
}

function showWeapon(v) {
  $('weapon').value = v;
  weapons.forEach((w, i) => w.objects.forEach(o => o.visible = v === 'all' || String(i) === v));
}

$('weapon').onchange = e => showWeapon(e.target.value);

// local files picked by the user: path (relative, with /) -> File
let localFiles = new Map();

function norm(p) { return p.replace(/\\/g, '/').replace(/^\.\//, ''); }
function dirOf(p) { const i = p.lastIndexOf('/'); return i >= 0 ? p.slice(0, i + 1) : ''; }
function baseOf(p) { return p.slice(p.lastIndexOf('/') + 1).toLowerCase(); }

function setLocalFiles(entries) {                       // entries: [{ path, file }]
  localFiles = new Map(entries.map(e => [norm(e.path), e.file]));
  const models = [...localFiles.keys()].filter(p => /\.(gltf|glb)$/i.test(p)).sort();
  $('model').innerHTML = models.length
    ? models.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('')
    : '<option>(no .gltf / .glb found)</option>';
  $('model').disabled = models.length === 0;
  if (!models.length) { setInfo('No .gltf or .glb among the selected files.'); return; }
  // after "Open folder…", reopen the model that was missing its files first
  const again = wanted && models.find(p => baseOf(p) === wanted);
  wanted = null;
  const first = again || models[0];
  $('model').value = first;
  loadLocal(first);
}

let wanted = null;                                      // model to reopen after its folder is opened

function loadLocal(path) {
  const file = localFiles.get(path);
  if (!file) return;
  blobUrls.forEach(u => URL.revokeObjectURL(u)); blobUrls = [];
  const dir = dirOf(path);
  const manager = new THREE.LoadingManager();
  const missing = [];
  manager.setURLModifier(url => {
    if (/^(blob:|data:|https?:)/.test(url)) return url;
    const rel = norm(decodeURIComponent(url));
    const f = localFiles.get(dir + rel) || localFiles.get(rel) ||
              [...localFiles.entries()].find(([k]) => baseOf(k) === baseOf(rel))?.[1];
    if (!f) { missing.push(rel); return url; }
    const u = URL.createObjectURL(f); blobUrls.push(u); return u;
  });
  const loader = new GLTFLoader(manager);
  setInfo('Loading ' + path + ' …');
  const needFolder = () => { wanted = baseOf(path); };
  file.arrayBuffer().then(buf => loader.parse(buf, '', gltf => {
    showModel(gltf, path);
    if (missing.length) {
      needFolder();
      setInfo(`${path} is missing ${missing.join(', ')}. Use Open folder… on the folder it's in to load everything.`, true);
    }
  }, err => {
    if (missing.length) {
      needFolder();
      setInfo(`${path} needs ${missing.join(', ')} from its folder. Use Open folder… on the folder it's in.`, true);
    } else setInfo('Load failed: ' + (err?.message || err), true);
  }));
}

$('openFolder').onclick = () => $('folderInput').click();
$('folderInput').onchange = e => { const fs = [...e.target.files]; if (fs.length) setLocalFiles(fs.map(f => ({ path: f.webkitRelativePath || f.name, file: f }))); e.target.value = ''; };
$('model').onchange = e => loadLocal(e.target.value);

// drag and drop (files and folders)
async function readEntry(entry, prefix, out) {
  if (entry.isFile) {
    out.push({ path: prefix + entry.name, file: await new Promise((res, rej) => entry.file(res, rej)) });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    let batch;
    do {
      batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      for (const child of batch) await readEntry(child, prefix + entry.name + '/', out);
    } while (batch.length);
  }
}
window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
window.addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const out = [];
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) for (const en of entries) await readEntry(en, '', out);
  else for (const f of e.dataTransfer.files) out.push({ path: f.name, file: f });
  if (out.length) setLocalFiles(out);
});

// ------------------------------------------------------------------ animation
function setAnim(i) {
  if (!clips[i]) return;
  $('anim').value = i;
  mixer.stopAllAction();
  action = mixer.clipAction(clips[i]); action.play();
  const t = new Set(); clips[i].tracks.forEach(tr => tr.times.forEach(x => t.add(+x.toFixed(5))));
  times = [...t].sort((a, b) => a - b);
  $('rest').checked = false;
  updateSlider(); setFrame(0);
}

function updateSlider() {
  const n = times.length;
  $('frame').max = Math.max(0, n - 1);
  $('frame').disabled = n <= 1;
  $('play').disabled = n <= 1;
  $('flabel').textContent = n ? `${+$('frame').value} / ${n - 1}` : '–';
}

function setPlaying(on) {
  playing = on && times.length > 1;
  $('play').textContent = playing ? '❚❚ Pause' : '▶ Play';
  if (playing && $('rest').checked) { $('rest').checked = false; setAnim(+$('anim').value); playing = true; $('play').textContent = '❚❚ Pause'; }
  clock.getDelta();
}

function setFrame(f) {
  if (!mixer || !times.length) return;
  f = Math.max(0, Math.min(times.length - 1, f | 0));
  $('frame').value = f; setPlaying(false);
  mixer.setTime(times[f]); updateSlider();
  renderer.render(scene, camera);
}

$('anim').onchange = e => setAnim(+e.target.value);
$('frame').oninput = e => setFrame(+e.target.value);
$('play').onclick = () => setPlaying(!playing);
$('bones').onchange = e => { if (helper) helper.visible = e.target.checked; };
$('resetCam').onclick = frameCamera;
$('rest').onchange = e => {
  if (!model) return;
  if (e.target.checked) { setPlaying(false); mixer.stopAllAction(); model.traverse(o => { if (o.isSkinnedMesh) o.skeleton.pose(); }); }
  else if (clips.length) setAnim(+$('anim').value);
};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); setFrame(+$('frame').value + 1); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); setFrame(+$('frame').value - 1); }
});

function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  if (mixer && playing) {
    mixer.update(dt * +$('speed').value);
    if (action && times.length) {
      const t = action.time; let f = 0; while (f + 1 < times.length && times[f + 1] <= t + 1e-6) f++;
      $('frame').value = f; updateSlider();
    }
  }
  controls.update(); renderer.render(scene, camera);
}

resize(); tick();
</script>
</body>
</html>
